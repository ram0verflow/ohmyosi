name: Go

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l cmd/ohmyosi/control.go cmd/ohmyosi/control_test.go cmd/ohmyosi/main.go internal/api/server.go internal/api/server_test.go)
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi
  mac-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile native app
        run: swift build --package-path mac
